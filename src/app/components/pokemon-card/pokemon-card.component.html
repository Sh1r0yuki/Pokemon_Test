<mat-card appearance="outlined">
    <mat-card-header>
        <mat-card-title>
            {{name}}
        </mat-card-title>
        <div class="favorite-button">
            <button mat-icon-button (click)="toggleFavorite()" [color]="isFavorite ? 'warn' : 'default'">
                <mat-icon>{{ isFavorite ? 'favorite' : 'favorite_border' }}</mat-icon>
            </button>
        </div>
    </mat-card-header>
    <mat-card-content>
        <img [src]="imageUrl" />
    </mat-card-content>
    <mat-card-actions>
        <button mat-button [routerLink]="'/pokemon-details/' + id">Détails</button>
    </mat-card-actions>
</mat-card>
